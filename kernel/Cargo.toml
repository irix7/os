[package]
license = "GPL-3.0-only"
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/main.rs"
# A no_main MIPS kernel binary: only built for cross-compilation (never host-tested,
# links std would conflict with the no_std panic_handler).
required-features = ["cross"]

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 2

[features]
default = ["erofs-debug"]
cross = []
# Debug console EROFS-over-HTTP command.  The loadable erofs module is the
# normal filesystem path; this feature is off by default to keep the PROM small.
erofs-debug = ["dep:erofs"]

[dependencies]
boot-protocol-tests = { path = "../crates/boot-protocol-tests" }
irix7-fmt = { path = "../crates/irix7-fmt" }
irix7-config = { path = "../crates/irix7-config" }
block-store = { path = "../crates/block-store" }
irix7-netif = { path = "../crates/irix7-netif" }
irix7-seeq = { path = "../crates/irix7-seeq" }
agnostic-core = { path = "../crates/agnostic-core" }
kernel-core = { path = "../crates/kernel-core" }
frame-alloc = { path = "../crates/frame-alloc" }
irix7-sha256 = { path = "../crates/irix7-sha256" }
tcp-slots = { path = "../crates/tcp-slots" }
cas-core = { path = "../crates/cas-core" }
cas-store = { path = "../crates/cas-store" }
embedded-io = { version = "0.7", default-features = false }
erofs = { path = "../crates/erofs", default-features = false, optional = true }
hpc3 = { path = "../crates/hpc3" }
irix-elf = { path = "../crates/irix-elf" }
mesh-core = { path = "../crates/mesh-core" }
native-abi = { path = "../crates/native-abi" }
m1-policy-bridge = { path = "../crates/m1-policy-bridge" }
mesh-service = { path = "../crates/mesh-service", default-features = false }
wasm-policy-host = { path = "../crates/wasm-policy-host" }
platform-api = { path = "../crates/platform-api" }
sys-primitives = { path = "../crates/sys-primitives" }
wasm-host = { path = "../crates/wasm-host", default-features = false }
wasm-probe = { path = "../crates/wasm-probe" }
mcp = { path = "../crates/mcp" }
block-cache = { path = "../crates/block-cache" }
overlay = { path = "../crates/overlay" }
mesh-transport = { path = "../crates/mesh-transport" }
mesh-stream = { path = "../crates/mesh-stream" }
mesh-join = { path = "../crates/mesh-join" }
mesh-route = { path = "../crates/mesh-route" }
mesh-migrate = { path = "../crates/mesh-migrate" }
embedded-tls = { version = "0.19", default-features = false, features = ["alloc", "rustpki", "p384", "rsa"] }
rand_core = { version = "0.6", default-features = false }
x509-cert = { version = "0.2", default-features = false }
smoltcp = { version = "0.13", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "proto-dns",
    "proto-dhcpv4",
    "socket-dns",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
] }
module-abi.workspace = true
