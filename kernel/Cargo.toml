[package]
license = "GPL-3.0-only"
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/main.rs"
# A no_main MIPS kernel binary: only built for cross-compilation (never host-tested,
# links std would conflict with the no_std panic_handler).
required-features = ["cross"]

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 2

[features]
default = []
cross = []
# Debug console EROFS-over-HTTP command.  The loadable erofs module is the
# normal filesystem path; this feature is off by default to keep the PROM small.
erofs-debug = ["dep:erofs"]

[dependencies]
embedded-io = { version = "0.7", default-features = false }
erofs = { path = "../crates/erofs", default-features = false, optional = true }
hpc3 = { path = "../crates/hpc3" }
irix-elf = { path = "../crates/irix-elf" }
embedded-tls = { version = "0.19", default-features = false, features = ["alloc", "rustpki", "p384", "rsa"] }
rand_core = { version = "0.6", default-features = false }
x509-cert = { version = "0.2", default-features = false }
smoltcp = { version = "0.13", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "proto-dns",
    "proto-dhcpv4",
    "socket-dns",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
] }
module-abi.workspace = true
