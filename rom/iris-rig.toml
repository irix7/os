# iris configuration for the ROM bring-up rig.
#
# Run iris from a directory that has the SCSI images, e.g.:
#
#   cd /mnt/europa/iris
#   ./target/launcher/bin/iris --config /path/to/rom/iris-rig.toml \
#          --prom /path/to/rom.bin \
#          --bank0 32 --bank1 0 \
#          --monitor-port 9998 --serial-log /tmp/serial.log
#
# Two settings matter here:
#
#   resolution  the kernel programs the 1280x1024 VC2 timing table itself;
#               the host preset keeps the emulator surface and the earliest
#               ROM output at a known size.  The kernel draws through the real
#               REX3 pipeline either way.
#
#   no --headless  headless mode turns the Newport off entirely, and there
#               is then no graphics device for the kernel to draw on.  In
#               --ci mode the window is hidden but the REX3 keeps rendering
#               to an offscreen buffer.

[graphics]
board = "newport"
heads = 1
resolution = "1280x1024"

# The internal disk used by the M4 SCSI tests.  Run iris from a directory that
# contains scsi1.raw (normally /mnt/europa/iris).
[scsi.1]
path = "scsi1.raw"

# Empty CD-ROM tray: the emulator's default configuration points at a
# cdrom4.iso that is not present in this checkout.
[scsi.4]
cdrom = true

# The kernel's telnet console listens on guest port 23.  Forward it to the
# host loopback so `telnet 127.0.0.1 2323` reaches the machine.
[[port_forward]]
proto      = "tcp"
host_port  = 2323
guest_port = 23
bind       = "localhost"


# The module HTTP server listens on guest port 80.
[[port_forward]]
proto      = "tcp"
host_port  = 8088
guest_port = 80
bind       = "localhost"
