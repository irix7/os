[package]
name = "rom"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "rom"
path = "src/main.rs"
# A no_main MIPS ROM binary: only built for cross-compilation (never host-tested,
# links std would conflict with the no_std panic_handler).
required-features = ["cross"]

[dependencies]
irix7-seeq = { path = "../crates/irix7-seeq" }
smoltcp = { version = "0.13", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-dhcpv4"] }

[features]
default = []
cross = []

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 2