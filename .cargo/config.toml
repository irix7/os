# IRIX 7 cargo target configuration.
#
# The custom MIPS/IRIX target needs an explicit entry symbol because rust-lld's
# default entry (`__start`) does not match our `_start`. Both the ROM and the
# kernel use the same n32 target and link with their own linker script.

[target.mips3-sgi-irix7-n32]
rustflags = [
  "-C", "link-arg=-e",
  "-C", "link-arg=_start",
]
