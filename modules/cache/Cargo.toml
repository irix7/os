[package]
license = "GPL-3.0-only"
name = "cache-module"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cache-module"
path = "src/main.rs"

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 2

[dependencies]
module-abi.workspace = true
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
