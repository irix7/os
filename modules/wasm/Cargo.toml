[package]
license = "GPL-3.0-only"
name = "wasm-module"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wasm-module"
path = "src/main.rs"

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 2

[dependencies]
m1-policy-bridge = { path = "../../crates/m1-policy-bridge" }
module-abi.workspace = true
sys-primitives = { path = "../../crates/sys-primitives" }
wasm-host = { path = "../../crates/wasm-host", default-features = false }
wasm-policy-host = { path = "../../crates/wasm-policy-host" }
wasmi = { version = "2.0", default-features = false, features = [
    "deterministic",
    "libm",
    "prefer-btree-collections",
    "validate",
] }
