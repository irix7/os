[package]
name = "irix7-user-hello"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "hello"
path = "src/main.rs"

[workspace]

[dependencies]
native-libc = { path = "../libc" }

[profile.release]
panic = "abort"
# The n32 LLVM backend miscompiles the libc write/exit flow at -Oz: it
# drops the post-write continuation.  Keep the smoke image at -O1 until the
# codegen issue is isolated.
opt-level = 1
lto = false
