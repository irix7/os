[package]
name = "mesh-route"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "M2 remote capability routing, route cache leases and one-MOVED retry"

[lib]
name = "mesh_route"
path = "src/lib.rs"

[dependencies]
sys-primitives = { path = "../sys-primitives" }
mesh-core = { path = "../mesh-core" }
cap-engine = { path = "../cap-engine" }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }

[dev-dependencies]
mesh-transport = { path = "../mesh-transport" }
