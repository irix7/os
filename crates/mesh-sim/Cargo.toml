[package]
name = "mesh-sim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Host simulation of the 1-128-node IRIX 7 logical computer"

[lib]
path = "src/lib.rs"

[dependencies]
mesh-core = { path = "../mesh-core" }
mesh-service = { path = "../mesh-service" }
sys-primitives = { path = "../sys-primitives" }

[dev-dependencies]
agnostic-core = { path = "../agnostic-core" }
cap-engine = { path = "../cap-engine" }
cas-core = { path = "../cas-core" }
cas-store = { path = "../cas-store" }
ed25519-dalek = { version = "2.1", default-features = false }
