[package]
license = "GPL-3.0-only"
name = "kernel-x86"
version = "0.1.0"
edition = "2021"
description = "IRIX 7 x86_64 machine: boot path, traps and devices"

[dependencies]
irix7-fmt = { path = "../crates/irix7-fmt" }
frame-alloc = { path = "../crates/frame-alloc" }
module-abi.workspace = true
irix7-sha256 = { path = "../crates/irix7-sha256" }
smoltcp = { version = "0.13", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-dhcpv4", "socket-tcp"] }

[[bin]]
name = "kernel-x86"
path = "src/main.rs"
# A no_main machine image: cross-built only, never linked for the host.
required-features = ["cross"]

[features]
cross = []
