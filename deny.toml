# cargo-deny configuration for IRIX 7.
# Project is GPL-3.0-only. Dependencies must be GPLv3-compatible.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "0BSD",
  "ISC",
  "Unlicense",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
]

# Some older crates still use the deprecated `MIT/Apache-2.0` spelling, which
# is not a valid SPDX expression.  They are genuinely dual-licensed; state the
# intended expression so the licence gate can read it.
[[licenses.clarify]]
crate = "bitflags@1.3.2"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "ff@0.13.1"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "group@0.13.0"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "version_check@0.9.5"
expression = "MIT OR Apache-2.0"
license-files = []

[advisories]
# The RSA crate is used only to verify server certificate and
# CertificateVerify signatures with public keys.  The Marvin timing
# side-channel affects private-key operations, which this kernel never
# performs (there is no RSA decryption or signing path).
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no private-key operations" },
  # crypto-bigint 0.5.5 is pulled in by elliptic-curve 0.13 for ECDSA and
  # ephemeral ECDH.  Its constant-time arithmetic may branch depending on the
  # compiler and target CPU.  This is accepted for a hobby operating system's
  # TLS transport; it is not protecting a long-lived high-value secret.
  { id = "RUSTSEC-2026-0387", reason = "accepted timing side channel in TLS ECDSA/ECDH for a non-mission-critical machine" },
]
