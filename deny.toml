# cargo-deny configuration for IRIX 7.
# Project is GPL-3.0-only. Dependencies must be GPLv3-compatible.

[[lint]]
# Licenses that are allowed for dependencies.
allow = [
    # Permissive licenses (GPLv3-compatible)
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT OR Apache-2.0",
    "Apache-2.0",
    "Unlicense",
    # GPLv3-compatible copyleft
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
]

# Deny non-GPL-compatible licenses.
deny = [
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "AGPL-*",
]

# When a dependency has multiple licenses, any one matching `allow` is enough.
multiple = "any"

# Scope of the check: dependencies (not dev-dependencies unless they are
# needed for building).
scope = "dependencies"

# Check both the workspace and member crates.
include-workspace-members = true
include-workspace-excludes = false

[[registry]]
# Allow all crates from crates.io by default (filtered by license above).
allow = []

[[git]]
# Allow all git dependencies by default (filtered by license above).
allow = []

[[lint.copyright]]
# No specific copyright holders required.
allow = []

[[lint.vulnerability]]
# Deny known vulnerabilities.
deny = ["unsound"]

[[lint.yanked]]
# Allow yanked crates (some older versions may be yanked).
deny = []
