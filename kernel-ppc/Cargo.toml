[package]
license = "GPL-3.0-only"
name = "kernel-ppc"
version = "0.1.0"
edition = "2021"
description = "IRIX 7 PowerPC G3 machine: boot path, traps and devices"

[dependencies]
irix7-fmt = { path = "../crates/irix7-fmt" }
irix7-sha256 = { path = "../crates/irix7-sha256" }
kernel-core = { path = "../crates/kernel-core" }
module-abi.workspace = true

[[bin]]
name = "kernel-ppc"
path = "src/main.rs"
# A no_main machine image: cross-built only, never linked for the host.
required-features = ["cross"]

[features]
cross = []
