# IRIX 7 boot configuration.
#
# The kernel fetches this file from
#   https://raw.githubusercontent.com/irix7/os/main/boot/config.conf
# after DHCP and TLS, then uses mcp.url/mcp.sha256 to load the control plane.
# The release workflow replaces this file and adds the module under
# boot/modules/<tag>/ after a release.  Keep this file public: it must not
# contain a bearer token.
version=1
release=unreleased
