name: Feature request
description: Propose a new capability or an improvement
title: "[Feature]: "
labels: ["type/feature", "status/needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should IRIX 7 do? Include the interface if it crosses a boundary.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider, and why is the proposal better?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Kernel
        - Compatibility (IRIX ABI)
        - Drivers
        - Display / X11
        - Storage
        - Network
        - Toolchain
        - Infra / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it works? Make it testable.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and Discussions.
          required: true
        - label: This is not a clean-room or security issue (those have their own forms).
          required: true
