version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    labels:
      - "area/infra"
      - "dependencies"
    commit-message:
      prefix: "build"
      include: scope
    groups:
      patch:
        patterns: ["*"]
        update-types: ["patch"]
      minor:
        patterns: ["*"]
        update-types: ["minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    labels:
      - "area/infra"
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: scope
