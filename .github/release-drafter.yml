name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: Features
    labels:
      - type/feature
  - title: Fixes
    labels:
      - type/bug
  - title: Compatibility
    labels:
      - area/compat
  - title: Display and media
    labels:
      - area/display
  - title: Storage
    labels:
      - area/storage
  - title: Networking and MCP
    labels:
      - area/network
  - title: Documentation and specs
    labels:
      - area/docs
      - type/adr
  - title: Infrastructure and toolchain
    labels:
      - area/infra
      - area/toolchain
  - title: Security
    labels:
      - area/security
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - release/major
  minor:
    labels:
      - release/minor
  patch:
    labels:
      - release/patch
  default: patch
template: |
  ## What changed

  $CHANGES

  ## Notes

  - This is a pre-1.0 release. Interfaces may change.
  - Check the install/upgrade notes before booting on a real Indy.
