name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-03
          components: rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Build artefacts
        run: ./scripts/release/build.sh
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        run: cosign sign-blob --yes dist/SHA256SUMS --output-signature dist/SHA256SUMS.sig
      - name: Upload to R2
        if: ${{ env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp dist/ "s3://${R2_BUCKET}/releases/${GITHUB_REF_NAME}/" --recursive
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Propose boot configuration update
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          git fetch origin main --quiet
          if git show origin/main:boot/config.conf 2>/dev/null | cmp -s - dist/boot-config.conf; then
            echo "boot configuration already current on main"
            exit 0
          fi
          mkdir -p "boot/modules/${tag}"
          cp dist/httpd.module "boot/modules/${tag}/httpd.module"
          cp dist/boot-config.conf boot/config.conf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boot/config.conf "boot/modules/${tag}/httpd.module"
          branch="release-config/${tag}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git commit -m "release: point boot config at ${tag}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$branch"
          number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$number" ]; then
            gh pr create --base main --head "$branch" \
              --title "release: point boot config at ${tag}" \
              --body "Generated by the ${tag} release workflow. Merge after the release assets are public so new machines use the published module."
          else
            echo "existing pull request #${number} for ${branch}"
          fi
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
