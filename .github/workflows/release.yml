name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-03
          components: rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Build artefacts
        run: ./scripts/release/build.sh
      - name: Build the PowerPC floppy image
        run: |
          if ! command -v hformat >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y hfsutils
          fi
          tools/powerpc-floppy.sh dist/irix7-powerpc-floppy.img
      - name: Boot-check the x86_64 release image
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y qemu-system-x86
          fi
          X86_IMAGE="$PWD/dist/irix7-x86_64.elf" \
            tools/x86-qemu.sh "$RUNNER_TEMP/x86-release"
      - name: Checksums
        run: |
          cd dist
          # `dist` contains the runtime directory, so a plain `sha256sum *`
          # fails on it; checksum every file and keep the paths relative.
          find . -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        run: cosign sign-blob --yes dist/SHA256SUMS --output-signature dist/SHA256SUMS.sig
      - name: Upload to R2
        if: ${{ env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp dist/ "s3://${R2_BUCKET}/releases/${GITHUB_REF_NAME}/" --recursive
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.bin
            dist/*.elf
            dist/*.img
            dist/*.json
            dist/kernel-indy-latest.bin
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
