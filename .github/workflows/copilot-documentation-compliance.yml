name: Request Copilot Documentation Review

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  pull-requests: write

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    # Copilot won't review drafts.
    if: github.event.pull_request.draft == false
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Trigger an actual GitHub Copilot code review by requesting
          # the Copilot reviewer bot on this pull request. Copilot
          # evaluates the diff and posts its review as review comments,
          # including any guidance drawn from .github/copilot-instructions.md.
          #
          # NOTE: Copilot's review is free-text comments, not a structured
          # pass/fail verdict. There is no DOC_STATUS: FAIL string to gate
          # on; Copilot does not emit machine-readable compliance status.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' \
            || echo "::warning::Could not request Copilot reviewer. Is Copilot code review enabled and installed on this repository?"
