name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at 20:17 UTC (morning in Sydney): sync the roadmap, rebuild and publish.
    - cron: "17 20 * * *"

permissions:
  contents: write
  issues: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs and roadmap
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip docs]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the roadmap sync
        run: python3 -m unittest discover -s tree -p 'test_*.py'
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: Build documentation
        run: mdbook build
      - name: Sync roadmap statuses
        id: sync
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          PROJECT_URL: ${{ vars.PROJECT_URL || 'https://github.com/orgs/irix7/projects/2' }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tree/sync.py --report tree/sync-report.md
      - name: Build the roadmap tree
        run: |
          python3 tree/build.py --check
          python3 tree/build.py --out book/tree
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: book
      - name: Open roadmap sync PR
        id: open_pr
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.sync.outputs.changed == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: roadmap/sync
          base: main
          delete-branch: true
          add-paths: |
            tree/roadmap.json
          commit-message: |
            roadmap: sync milestone statuses

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "roadmap: sync milestone statuses"
          body-path: tree/sync-report.md
      - name: Note a failed sync
        if: steps.sync.outcome == 'failure'
        run: echo "::warning title=Roadmap sync failed::The site was built with the committed roadmap; see the Sync roadmap statuses step."
      - name: Note a skipped roadmap PR
        if: steps.open_pr.outcome == 'failure'
        run: echo "::warning title=Roadmap sync PR skipped::The site was deployed with synced statuses, but the roadmap/sync pull request could not be opened."

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
