              tail -50 "$work/iris.out" || true
              echo "--- serial log (tail)"
              tail -80 "$work/serial.log" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          iris-ci --socket "$socket" serial-wait 'file=hello from the IRIX 7 ramfs' --timeout 120
          iris-ci --socket "$socket" serial-wait 'relative=Welcome to IRIX 7.' --timeout 30
          iris-ci --socket "$socket" serial-wait 'stat_size=17' --timeout 30
          iris-ci --socket "$socket" serial-wait 'dev_null=ok' --timeout 30
          iris-ci --socket "$socket" serial-wait 'user: exit syscall code=0x00000000' --timeout 30
          iris-ci --socket "$socket" serial-wait 'm1-post: mesh=0/0/0' --timeout 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'BOOT-READY .*network=off mcp=disabled' 30
          iris-ci --socket "$socket" quit
          wait "$pid"

      - name: Boot ROM and user hello
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-boot"
          mkdir -p "$work"
          cd "$work"
          cat > "$work/machine.toml" <<'EOF'
          banks = [32, 0, 0, 0]
          no_audio = true

          [machine]
          profile = "indy_ip24"

          [scsi]
          EOF

          python3 - "$RUNNER_TEMP/user-hello/hello-disk.raw" "$work/target2.raw" "$work/nvram.bin" <<'PY'
          import sys

          user = open(sys.argv[1], "rb").read()
          open(sys.argv[2], "wb").write(user)
          env = b"net=off\0console=serial0\0\0"
          image = bytearray(8192)
          image[0x10:0x10 + len(env)] = env
          image[314:320] = bytes([0x02, 0x11, 0x22, 0x33, 0x44, 0x55])
          open(sys.argv[3], "wb").write(image)
