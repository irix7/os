name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: |
          if [ -f Cargo.toml ]; then
            cargo fmt --all -- --check
          else
            echo "No Rust workspace yet; skipping."
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: |
          if [ -f Cargo.toml ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            echo "No Rust workspace yet; skipping."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          if [ -f Cargo.toml ]; then
            cargo test -p kernel -p kernel-test -p boot-protocol-tests \
              -p erofs -p block-cache -p overlay -p hpc3 -p irix-elf -p native-abi \
              -p sys-primitives -p platform-api -p mesh-core -p mesh-service \
              -p mesh-sim -p fabric -p guest-abi -p cas-core -p cas-store \
              -p cap-engine -p agnostic-core -p wasm-host
          else
            echo "No Rust workspace yet; skipping."
          fi

  tools:
    name: MCP smoke tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: python3 -m unittest discover -s rom/tools -p 'test_*.py'

  std-surface:
    name: Std ABI surface audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned nightly + rust-src
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          rustup toolchain install nightly-2026-10-03 --component rust-src
          rustup default nightly-2026-10-03
      - name: Python tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Audit the std ABI surface (warning mode)
        run: python3 tools/std-abi-surface.py
      - name: Build native std rlib (spike)
        timeout-minutes: 15
        env:
          STD_SPIKE_WORK: ${{ runner.temp }}/std-spike
        run: tools/std-spike/build-std.sh

  cross:
    name: Cross-build (M0 gate)
    runs-on: ubuntu-latest
    # M0 gate: build-std must compile core/alloc for both custom targets.
    # Green (not continue-on-error) once the toolchain glue is resolved.
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - name: Ensure host C compiler (cc)
        run: |
          command -v cc >/dev/null 2>&1 || sudo apt-get install -y gcc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "m0-cross"
      - name: Build n32 kernel (build-std)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          RUST_LLD_DIR="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host)/bin"
          export RUST_LLD_DIR
          export PATH="$RUST_LLD_DIR:$PATH"
          cargo build -Z build-std=core,alloc -Zjson-target-spec \
            --target targets/mips3-sgi-irix7-n32.json -p kernel
      - name: Build ROM (build-std, M1)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          RUST_LLD_DIR="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host)/bin"
          export RUST_LLD_DIR
          export PATH="$RUST_LLD_DIR:$PATH"
          # The ROM links text at the PROM reset window and data in DRAM.
          CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Trom/linker.ld" \
            cargo build -Z build-std=core,alloc -Zjson-target-spec --features cross \
            --target targets/mips3-sgi-irix7-n32.json -p rom
      - name: Build native user hello ELF
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/user-hello-target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          RUST_LLD_DIR="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host)/bin"
          export RUST_LLD_DIR
          export PATH="$RUST_LLD_DIR:$PATH"
          tools/build-user-hello.sh ${{ runner.temp }}/user-hello

      - name: Build native target probe (build-std)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          RUST_LLD_DIR="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host)/bin"
          export RUST_LLD_DIR
          export PATH="$RUST_LLD_DIR:$PATH"
          # This is the hosted native target, not the kernel target: it must expose
          # target_os=irix7 and the unix family for the POSIX libc/std work.
          cargo build -Z build-std=core -Zjson-target-spec \
            --target targets/mips3-sgi-irix7-native-n32.json -p irix-elf -p native-abi
      - name: Build EROFS module (flat image)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          LLVM_TOOLS="$(rustc --print sysroot)/lib/rustlib/$HOST/bin"
          CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Tmodules/erofs/linker.ld" \
            cargo build --release -Z build-std=core,alloc -Zjson-target-spec \
            --target targets/mips3-sgi-irix7-n32.json -p erofs-module
          "$LLVM_TOOLS/llvm-objcopy" -O binary \
            target/mips3-sgi-irix7-n32/release/erofs-module erofs.module
          size=$(stat -c%s erofs.module)
          echo "erofs.module: $size bytes"
          test "$size" -le 2097152

  boot:
    name: Boot (iris)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src + llvm-tools
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "iris-boot"
      - name: Build release kernel
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          CARGO_PROFILE_RELEASE_OPT_LEVEL=s \
            CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Tkernel/linker.ld" \
            cargo build --release -Z build-std=core,alloc -Zjson-target-spec \
              --features cross --target targets/mips3-sgi-irix7-n32.json -p kernel
      - name: Build ROM
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Trom/linker.ld" \
            cargo build --release -Z build-std=core,alloc -Zjson-target-spec \
              --features cross --target targets/mips3-sgi-irix7-n32.json -p rom
          python3 rom/tools/make_prom.py \
            target/mips3-sgi-irix7-n32/release/rom "$RUNNER_TEMP/irix7-rom.bin"
      - name: Build user hello disk image
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/user-hello-target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/build-user-hello.sh "$RUNNER_TEMP/user-hello"
      - name: Build logical module
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          LLVM_OBJCOPY="$(rustc --print sysroot)/lib/rustlib/$HOST/bin/llvm-objcopy"
          CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Tmodules/logical/linker.ld" \
            cargo build --release -Z build-std=core,alloc \
              -Z build-std-features=compiler-builtins-mem -Zjson-target-spec \
              --target targets/mips3-sgi-irix7-n32.json -p logical-module
          "$LLVM_OBJCOPY" -O binary \
            target/mips3-sgi-irix7-n32/release/logical-module "$RUNNER_TEMP/logical.module"
      - name: Setup IRIS
        id: iris
        uses: irix7/iris/.github/actions/setup-iris@4b00413663a979d15b7ef8cd2208d95a030796a4
        with:
          version: v0.1.6+irix7
      - name: Boot ROM and user hello
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-boot"
          mkdir -p "$work"
          cd "$work"
          cat > "$work/machine.toml" <<'EOF'
          banks = [32, 0, 0, 0]
          no_audio = true

          [machine]
          profile = "indy_ip24"

          [scsi]
          EOF

          # Put the module after the 256 KiB user image on the same SCSI
          # target and point mcp.local at it. This exercises the offline
          # module source and the M1 local policy without a network fetch.
          python3 - "$RUNNER_TEMP/user-hello/hello-disk.raw" \
            "$RUNNER_TEMP/logical.module" "$work/target2.raw" "$work/nvram.bin" <<'PY'
          import hashlib
          import sys

          user = open(sys.argv[1], "rb").read()
          module = open(sys.argv[2], "rb").read()
          padded = module + b"\0" * ((-len(module)) % 512)
          lba = len(user) // 512
          sectors = len(padded) // 512
          open(sys.argv[3], "wb").write(user + padded)
          env = (f"mcp.local=2:{lba}:{sectors}:{hashlib.sha256(padded).hexdigest()}\0"
                 "net=off\0console=serial0\0\0").encode()
          image = bytearray(8192)
          image[0x10:0x10 + len(env)] = env
          image[314:320] = bytes([0x02, 0x11, 0x22, 0x33, 0x44, 0x55])
          open(sys.argv[4], "wb").write(image)
          PY

          socket="$work/iris.sock"
          iris --config "$work/machine.toml" --ci \
            --prom "$RUNNER_TEMP/irix7-rom.bin" \
            --scsi2 "$work/target2.raw" \
            --nvram "$work/nvram.bin" \
            --ci-socket "$socket" --monitor-port 18888 \
            --serial-log "$work/serial.log" >"$work/iris.out" 2>&1 &
          pid=$!
          cleanup() {
            status=$?
            kill "$pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- iris output (tail)"
              tail -50 "$work/iris.out" || true
              echo "--- serial log (tail)"
              tail -50 "$work/serial.log" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          # The module prints before the readiness marker, and the default
          # serial cursor does not rewind, so assert it first.
          iris-ci --socket "$socket" serial-wait 'cap=ok' --timeout 60
          iris-ci --socket "$socket" serial-wait 'BOOT-READY' --timeout 120
          iris-ci --socket "$socket" serial-wait 'hello from user' --timeout 60
          iris-ci --socket "$socket" serial-wait 'pipe=ok' --timeout 30
          iris-ci --socket "$socket" serial-wait 'winsize=100x40' --timeout 30
          iris-ci --socket "$socket" serial-wait 'user: exit syscall code=0x0000002A' --timeout 30
          iris-ci --socket "$socket" serial-wait 'logical: tick 3' --timeout 30
          grep -Eq 'BOOT-READY .*network=off mcp=local' "$work/serial.log"
          iris-ci --socket "$socket" quit
          wait "$pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-boot
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/iris-boot/serial.log
            ${{ runner.temp }}/iris-boot/iris.out

  modules:
    name: Modules (flat images, 2 MiB limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src + llvm-tools
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "modules-flat"
      - name: Build and flatten modules
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          LLVM_OBJCOPY="$(rustc --print sysroot)/lib/rustlib/$HOST/bin/llvm-objcopy"
          TARGET=targets/mips3-sgi-irix7-n32.json
          OUT=target/modules
          SIZES="$OUT/sizes.tsv"
          LIMIT=2097152
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

          mkdir -p "$OUT"
          : > "$SIZES"

          # module directory, package, build-std set. Every module links with
          # its own modules/<module>/linker.ld at 0x88400000.
          while read -r module package build_std; do
            echo "=== $module ($package, build-std=$build_std) ==="
            CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Tmodules/$module/linker.ld" \
              cargo build --release -Z "build-std=$build_std" \
                -Z build-std-features=compiler-builtins-mem -Zjson-target-spec \
                --target "$TARGET" -p "$package"
            "$LLVM_OBJCOPY" -O binary "target/mips3-sgi-irix7-n32/release/$package" "$OUT/$module.module"
            printf '%s\t%s\t%s\t%s\n' \
              "$module" "$package" "$build_std" "$(stat -c%s "$OUT/$module.module")" >> "$SIZES"
            echo
          done <<'EOF'
          hello  hello-module  core
          ticker ticker-module core
          block  block-module  core
          mcp    mcp-module    core,alloc
          erofs  erofs-module  core,alloc
          logical logical-module core,alloc
          EOF

          echo "=== Module image sizes (limit $LIMIT bytes) ==="
          printf '%-8s %-14s %-11s %12s %12s\n' module package build-std bytes limit
          failed=0
          while IFS=$'\t' read -r module package build_std size; do
            printf '%-8s %-14s %-11s %12s %12s\n' "$module" "$package" "$build_std" "$size" "$LIMIT"
            if [ "$size" -gt "$LIMIT" ]; then
              echo "::error::$module.module is $size bytes, over the $LIMIT-byte module area"
              failed=1
            fi
          done < "$SIZES"

          {
            echo "### Module image sizes"
            echo
            echo "| Module | Package | build-std | Bytes | Limit |"
            echo "| --- | --- | --- | ---: | ---: |"
            while IFS=$'\t' read -r module package build_std size; do
              echo "| $module | $package | $build_std | $size | $LIMIT |"
            done < "$SIZES"
          } >> "$SUMMARY"

          test "$failed" -eq 0

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: mdbook build
        run: mdbook build

  lint:
    name: Markdown and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#book" "#docs/research/**"
      - name: typos
        uses: crate-ci/typos@master
