          pid=$!
          cleanup() {
            status=$?
            kill "$pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- iris output (tail)"
              tail -50 "$work/iris.out" || true
              echo "--- serial log (tail)"
              tail -50 "$work/serial.log" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          # The kernel M1 line and the Wasm policy both print before the
          # readiness marker, and the default serial cursor does not rewind.
          iris-ci --socket "$socket" serial-wait 'm1: ' --timeout 30
          iris-ci --socket "$socket" serial-wait 'cap=ok' --timeout 60
          iris-ci --socket "$socket" serial-wait 'BOOT-READY' --timeout 300
          iris-ci --socket "$socket" serial-wait 'mesh=single' --timeout 10
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'm1: .*mesh=0/0/0' 30
          iris-ci --socket "$socket" serial-wait 'hello from user' --timeout 60
          iris-ci --socket "$socket" serial-wait 'pipe=ok' --timeout 30
          iris-ci --socket "$socket" serial-wait 'winsize=100x40' --timeout 30
          iris-ci --socket "$socket" serial-wait 'user: exit syscall code=0x0000002A' --timeout 30
          iris-ci --socket "$socket" serial-wait 'm1-post: mesh=0/0/0' --timeout 30
          iris-ci --socket "$socket" serial-wait 'logical: tick 3' --timeout 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'BOOT-READY .*network=off' 30

          # The local keyboard/display sash must also work with net=off.
          python3 - <<'PY'
          import socket
          import time

          with socket.create_connection(("127.0.0.1", 18888), timeout=5) as monitor:
              monitor.sendall(b"ps2 type help\r\n")
              time.sleep(0.2)
              monitor.sendall(b"ps2 enter\r\n")
          PY
          iris-ci --socket "$socket" serial-wait 'sash commands' --timeout 30
          iris-ci --socket "$socket" quit
          wait "$pid"
      - name: Boot the o32 probe
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-o32"
          mkdir -p "$work"
