          iris-ci --socket "$socket" quit
          wait "$pid"

      - name: Boot native std fallback
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-std-native"
          mkdir -p "$work"
          cd "$work"
          cat > "$work/machine.toml" <<'EOF'
          banks = [32, 0, 0, 0]
          no_audio = true

          [machine]
          profile = "indy_ip24"

          [scsi]
          EOF

          python3 - "$work/nvram.bin" <<'PY'
          import sys

          image = bytearray(8192)
          env = b"net=off\0console=serial0\0\0"
          image[0x10:0x10 + len(env)] = env
          image[314:320] = bytes([0x02, 0x11, 0x22, 0x33, 0x44, 0x55])
          open(sys.argv[1], "wb").write(image)
          PY

          socket="$work/iris.sock"
          iris --config "$work/machine.toml" --ci \
            --prom "$RUNNER_TEMP/irix7-rom.bin" \
            --scsi2 "$RUNNER_TEMP/std-hello/std-hello.raw" \
            --nvram "$work/nvram.bin" \
            --ci-socket "$socket" --monitor-port 18892 \
            --serial-log "$work/serial.log" >"$work/iris.out" 2>&1 &
          pid=$!
          cleanup() {
            status=$?
            kill "$pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- iris output (tail)"
              tail -50 "$work/iris.out" || true
              echo "--- serial log (tail)"
              tail -80 "$work/serial.log" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          iris-ci --socket "$socket" serial-wait 'file=hello from the IRIX 7 ramfs' --timeout 120
          iris-ci --socket "$socket" serial-wait 'relative=Welcome to IRIX 7.' --timeout 30
          iris-ci --socket "$socket" serial-wait 'stat_size=17' --timeout 30
          iris-ci --socket "$socket" serial-wait 'dev_null=ok' --timeout 30
          iris-ci --socket "$socket" serial-wait 'user: exit syscall code=0x00000000' --timeout 30
          iris-ci --socket "$socket" serial-wait 'm1-post: mesh=0/0/0' --timeout 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'BOOT-READY .*network=off mcp=disabled' 30
          iris-ci --socket "$socket" quit
          wait "$pid"

      - name: Boot ROM and user hello
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-boot"
          mkdir -p "$work"
          cd "$work"
          cat > "$work/machine.toml" <<'EOF'
          banks = [32, 0, 0, 0]
          no_audio = true

          [machine]
          profile = "indy_ip24"

          [scsi]
          EOF

          # Put the module after the 256 KiB user image on the same SCSI
          # target and point mcp.local at it. This exercises the offline
          # module source and the M1 local policy without a network fetch.
          python3 - "$RUNNER_TEMP/user-hello/hello-disk.raw" \
            "$RUNNER_TEMP/logical.module" "$work/target2.raw" "$work/nvram.bin" <<'PY'
          import hashlib
          import sys

          user = open(sys.argv[1], "rb").read()
          module = open(sys.argv[2], "rb").read()
          padded = module + b"\0" * ((-len(module)) % 512)
          lba = len(user) // 512
          sectors = len(padded) // 512
          open(sys.argv[3], "wb").write(user + padded)
          env = (f"mcp.local=2:{lba}:{sectors}:{hashlib.sha256(padded).hexdigest()}\0"
                 "net=off\0console=serial0\0\0").encode()
          image = bytearray(8192)
          image[0x10:0x10 + len(env)] = env
          image[314:320] = bytes([0x02, 0x11, 0x22, 0x33, 0x44, 0x55])
          open(sys.argv[4], "wb").write(image)
          PY

          socket="$work/iris.sock"
          iris --config "$work/machine.toml" --ci \
            --prom "$RUNNER_TEMP/irix7-rom.bin" \
            --scsi2 "$work/target2.raw" \
            --nvram "$work/nvram.bin" \
            --ci-socket "$socket" --monitor-port 18888 \
            --serial-log "$work/serial.log" >"$work/iris.out" 2>&1 &
          pid=$!
          cleanup() {
            status=$?
            kill "$pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- iris output (tail)"
              tail -50 "$work/iris.out" || true
              echo "--- serial log (tail)"
              tail -50 "$work/serial.log" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          # The kernel M1 line and the module policy both print before the
          # readiness marker, and the default serial cursor does not rewind.
          iris-ci --socket "$socket" serial-wait 'm1: ' --timeout 30
          iris-ci --socket "$socket" serial-wait 'cap=ok' --timeout 60
          iris-ci --socket "$socket" serial-wait 'BOOT-READY' --timeout 120
          iris-ci --socket "$socket" serial-wait 'mesh=single' --timeout 10
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'm1: .*mesh=0/0/0' 30
          iris-ci --socket "$socket" serial-wait 'hello from user' --timeout 60
          iris-ci --socket "$socket" serial-wait 'pipe=ok' --timeout 30
          iris-ci --socket "$socket" serial-wait 'winsize=100x40' --timeout 30
          iris-ci --socket "$socket" serial-wait 'user: exit syscall code=0x0000002A' --timeout 30
          iris-ci --socket "$socket" serial-wait 'm1-post: mesh=0/0/0' --timeout 30
          iris-ci --socket "$socket" serial-wait 'logical: tick 3' --timeout 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'BOOT-READY .*network=off mcp=local' 30

          # The local keyboard/display sash must also work with net=off.
          python3 - <<'PY'
          import socket
          import time

          with socket.create_connection(("127.0.0.1", 18888), timeout=5) as monitor:
              monitor.sendall(b"ps2 type help\r\n")
              time.sleep(0.2)
              monitor.sendall(b"ps2 enter\r\n")
          PY
          iris-ci --socket "$socket" serial-wait 'sash commands' --timeout 30
          iris-ci --socket "$socket" quit
          wait "$pid"
      - name: Boot the o32 probe
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-o32"
          mkdir -p "$work"
          cd "$work"
          cat > "$work/machine.toml" <<'EOF'
          banks = [32, 0, 0, 0]
          no_audio = true

          [machine]
          profile = "indy_ip24"

          [scsi]
          EOF

          python3 - "$RUNNER_TEMP/o32-hello/o32-hello.raw" \
            "$RUNNER_TEMP/logical.module" "$work/target2.raw" "$work/nvram.bin" <<'PY'
          import hashlib
          import sys

          user = open(sys.argv[1], "rb").read()
          module = open(sys.argv[2], "rb").read()
          padded = module + b"\0" * ((-len(module)) % 512)
          lba = len(user) // 512
          sectors = len(padded) // 512
          open(sys.argv[3], "wb").write(user + padded)
          env = (f"mcp.local=2:{lba}:{sectors}:{hashlib.sha256(padded).hexdigest()}\0"
                 "net=off\0console=serial0\0\0").encode()
          image = bytearray(8192)
          image[0x10:0x10 + len(env)] = env
          image[314:320] = bytes([0x02, 0x11, 0x22, 0x33, 0x44, 0x55])
          open(sys.argv[4], "wb").write(image)
          PY

          socket="$work/iris.sock"
          iris --config "$work/machine.toml" --ci \
            --prom "$RUNNER_TEMP/irix7-rom.bin" \
            --scsi2 "$work/target2.raw" \
            --nvram "$work/nvram.bin" \
            --ci-socket "$socket" --monitor-port 18889 \
            --serial-log "$work/serial.log" >"$work/iris.out" 2>&1 &
          pid=$!
          cleanup() {
            status=$?
            kill "$pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- iris output (tail)"
              tail -50 "$work/iris.out" || true
              echo "--- serial log (tail)"
              tail -50 "$work/serial.log" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          iris-ci --socket "$socket" serial-wait 'm1: ' --timeout 30
          iris-ci --socket "$socket" serial-wait 'cap=ok' --timeout 60
          iris-ci --socket "$socket" serial-wait 'BOOT-READY' --timeout 120
          iris-ci --socket "$socket" serial-wait 'mesh=single' --timeout 10
          iris-ci --socket "$socket" serial-wait 'hello from o32' --timeout 30
          iris-ci --socket "$socket" serial-wait 'hello from the IRIX 7 ramfs' --timeout 30
          iris-ci --socket "$socket" serial-wait 'user: exit syscall code=0x0000002A' --timeout 30
          iris-ci --socket "$socket" serial-wait 'm1-post: mesh=0/0/0' --timeout 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'BOOT-READY .*network=off mcp=local' 30
          iris-ci --socket "$socket" quit
          wait "$pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-boot
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/iris-diskless/serial.log
            ${{ runner.temp }}/iris-diskless/iris.out
            ${{ runner.temp }}/iris-wasm-autoload/serial.log
            ${{ runner.temp }}/iris-wasm-autoload/iris.out
            ${{ runner.temp }}/iris-offline-no-module/serial.log
            ${{ runner.temp }}/iris-offline-no-module/iris.out
            ${{ runner.temp }}/iris-boot/serial.log
            ${{ runner.temp }}/iris-boot/iris.out
            ${{ runner.temp }}/iris-wasm-local/serial.log
            ${{ runner.temp }}/iris-wasm-local/iris.out
            ${{ runner.temp }}/iris-runtime-deps/serial.log
            ${{ runner.temp }}/iris-runtime-deps/iris.out
            ${{ runner.temp }}/iris-runtime-deps/mcp-modules.txt
            ${{ runner.temp }}/iris-std/serial.log
            ${{ runner.temp }}/iris-std/iris.out
            ${{ runner.temp }}/iris-std-native/serial.log
            ${{ runner.temp }}/iris-std-native/iris.out
            ${{ runner.temp }}/iris-o32/serial.log
            ${{ runner.temp }}/iris-o32/iris.out

  mesh-real:
    name: Mesh two-kernel (M2 gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src + llvm-tools
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "mesh-real"
      - name: Setup IRIS
        id: iris
        uses: irix7/iris/.github/actions/setup-iris@8da7ae21e558f4d5d075e5f50720fabba0a728e6
        with:
          version: v0.1.10+irix7
      - name: Build the two-node artefacts
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          work="$RUNNER_TEMP/m2-build"
          tools/m2-rig/build.sh "$work"
          sha256sum "$work/irix7-rom.bin" "$work/mcp.module" | tee "$work/SHA256SUMS"
          test "$(stat -c%s "$work/irix7-rom.bin")" -le 524288
          test "$(stat -c%s "$work/mcp.module")" -le 524288
      - name: Host harness tests
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/m2-rig/Cargo.toml
      - name: Run two real kernels
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          iris_bin="$(command -v iris)"
          iris_ci="$(command -v iris-ci)"
          build="$RUNNER_TEMP/m2-build"
          harness="$RUNNER_TEMP/m2-rig-harness"
          cargo build --release --manifest-path tools/m2-rig/Cargo.toml \
            --target-dir "$harness"
          bin="$harness/release/m2-rig"

          # Every mode gets its own work directory and port block.  The rig
          # stops both guests itself; cleanup only runs `down` on a failed
          # scenario and never masks the run's exit status.
          run_mode() {
            mode="$1"
            base="$2"
            work="$RUNNER_TEMP/m2-run-$mode"
            echo "::group::m2-rig $mode (base port $base)"
            "$bin" run \
              --work "$work" \
              --rom "$build/irix7-rom.bin" \
              --module "$build/mcp.module" \
              --iris "$iris_bin" --iris-ci "$iris_ci" \
              --base-port "$base" --timeout 240 --fault "$mode"
            echo "::endgroup::"
          }
          cleanup() {
            status=$?
            trap - EXIT
            for mode in none no-peer kill-peer partition; do
              work="$RUNNER_TEMP/m2-run-$mode"
              if [ -d "$work" ]; then
                "$bin" down --work "$work" \
                  --rom "$build/irix7-rom.bin" \
                  --module "$build/mcp.module" \
                  --iris "$iris_bin" --iris-ci "$iris_ci" >/dev/null 2>&1 || true
              fi
            done
            exit "$status"
          }
          trap cleanup EXIT

          # The default mode proves join, homes, route/MOVED, L0 migration,
          # the member restart, the signed epoch restore and the root restart.
          run_mode none 9700
          # The no-peer mode preserves the M1 `mesh=single`/`mesh=0/0/0` path.
          run_mode no-peer 9800
          # The two failure modes prove removal/fencing and the partition rule.
          run_mode kill-peer 9900
          run_mode partition 10000
      - name: Collect evidence
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m2-evidence"
          mkdir -p "$out"
          for mode in none no-peer kill-peer partition; do
            work="$RUNNER_TEMP/m2-run-$mode"
            if [ -d "$work/evidence" ]; then
              cp -a "$work/evidence" "$out/$mode"
            fi
            if [ -d "$work" ]; then
              for node in n0 n1; do
                mkdir -p "$out/$mode/$node"
                for file in iris-serial.log stdout stderr; do
                  if [ -f "$work/$node/$file" ]; then
                    cp "$work/$node/$file" "$out/$mode/$node/$file"
                  fi
                done
              done
            fi
          done
          cp "$RUNNER_TEMP/m2-build/SHA256SUMS" "$out/"
          find "$out" -type f | sort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-real-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/m2-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-real-artifacts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/m2-build/SHA256SUMS
            ${{ runner.temp }}/m2-build/irix7-rom.bin
            ${{ runner.temp }}/m2-build/mcp.module

  modules:
    name: Modules (flat images, 2 MiB limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src + llvm-tools
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "modules-flat"
      - name: Check the Wasm guest is reproducible
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/build-wasm-guest.sh "$RUNNER_TEMP/policy-guest.wasm"
          cmp "$RUNNER_TEMP/policy-guest.wasm" modules/wasm/src/guest.wasm
      - name: Build and flatten modules
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          LLVM_OBJCOPY="$(rustc --print sysroot)/lib/rustlib/$HOST/bin/llvm-objcopy"
          TARGET=targets/mips3-sgi-irix7-n32.json
          OUT=target/modules
          SIZES="$OUT/sizes.tsv"
          LIMIT=2097152
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

          mkdir -p "$OUT"
          : > "$SIZES"

          # module directory, package, build-std set, release opt-level.
          # Every module links with its own modules/<module>/linker.ld.
          while read -r module package build_std opt; do
            echo "=== $module ($package, build-std=$build_std, opt=$opt) ==="
            CARGO_PROFILE_RELEASE_OPT_LEVEL="$opt" \
            CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Tmodules/$module/linker.ld" \
              cargo build --release -Z "build-std=$build_std" \
                -Z build-std-features=compiler-builtins-mem -Zjson-target-spec \
                --target "$TARGET" -p "$package"
            "$LLVM_OBJCOPY" -O binary "target/mips3-sgi-irix7-n32/release/$package" "$OUT/$module.module"
            cp "$OUT/$module.module" "$OUT/$module.flat"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$module" "$package" "$build_std" "$opt" \
              "$(stat -c%s "$OUT/$module.module")" >> "$SIZES"
            echo
          done <<'EOF'
          hello  hello-module  core 2
          ticker ticker-module core 2
          block  block-module  core 2
          mcp    mcp-module    core,alloc z
          erofs  erofs-module  core,alloc 2
          logical logical-module core,alloc 2
          cache  cache-module  core,alloc 2
          manager runtime-manager-module core,alloc z
          demo-dep runtime-demo-dep-module core,alloc z
          demo-root runtime-demo-root-module core,alloc z
          m2-mesh runtime-m2-mesh-module core,alloc z
          m2-root runtime-m2-root-module core,alloc z
          wasm   wasm-module   core,alloc z
          EOF

          echo "=== Module image sizes (limit $LIMIT bytes, wasm slot limit 1572864) ==="
          printf '%-8s %-14s %-11s %4s %12s %12s\n' module package build-std opt bytes limit
          failed=0
          while IFS=$'\t' read -r module package build_std opt size; do
            limit="$LIMIT"
            if [ "$module" = wasm ]; then
              limit=1572864
            elif [ "$module" = mcp ]; then
              # MCP is slot A: 512 KiB at 0x88400000.
              limit=524288
            elif [ "$module" = manager ] || [ "$module" = demo-dep ] || [ "$module" = demo-root ] || [ "$module" = m2-mesh ] || [ "$module" = m2-root ]; then
              # The manager occupies the first 256 KiB of slot B; the arena
              # regions after it are also 256 KiB.
              limit=262144
            fi
            printf '%-8s %-14s %-11s %4s %12s %12s\n' \
              "$module" "$package" "$build_std" "$opt" "$size" "$limit"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$module.module is $size bytes, over the $limit-byte slot"
              failed=1
            fi
          done < "$SIZES"

          {
            echo "### Module image sizes"
            echo
            echo "| Module | Package | build-std | opt | Bytes | Limit |"
            echo "| --- | --- | --- | --- | ---: | ---: |"
            while IFS=$'\t' read -r module package build_std opt size; do
              limit="$LIMIT"
              if [ "$module" = wasm ]; then
                limit=1572864
              elif [ "$module" = mcp ]; then
                # MCP is slot A: 512 KiB at 0x88400000.
                limit=524288
              elif [ "$module" = manager ] || [ "$module" = demo-dep ] || [ "$module" = demo-root ] || [ "$module" = m2-mesh ] || [ "$module" = m2-root ]; then
                limit=262144
              fi
              echo "| $module | $package | $build_std | $opt | $size | $limit |"
            done < "$SIZES"
          } >> "$SUMMARY"

          test "$failed" -eq 0

          # The M2 root must not link the mesh library. The dependency is real
          # only if the manager supplies `irix7.mesh.transport@1` at runtime.
          if cargo tree -p runtime-m2-root-module -e normal | grep -q 'mesh-transport'; then
            echo "::error::runtime-m2-root-module links mesh-transport"
            exit 1
          fi
          if ! cargo tree -p runtime-m2-mesh-module -e normal | grep -q 'mesh-transport'; then
            echo "::error::runtime-m2-mesh-module does not link mesh-transport"
            exit 1
          fi

      - name: Build signed runtime graph
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          seed="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          cargo run --quiet --manifest-path tools/module-release/Cargo.toml -- \
            build --spec packages/runtime-modules.toml --out target/modules/release \
              --raw-base https://example.invalid --release ci --key "$seed" --epoch 1
          test -s target/modules/release/package-index.conf
          test -s target/modules/release/package-index.conf.sig
          test -s target/modules/release/release-trust.conf
          grep -q "depends=demo-dep@1.0.0:" target/modules/release/package-index.conf
          grep -q "depends=m2-mesh@1.0.0:" target/modules/release/package-index.conf
          grep -q "exports=irix7.mesh.transport@1:" target/modules/release/package-index.conf
          grep -q "sig=1:" target/modules/release/package-index.conf
          manager_size="$(stat -c%s target/modules/release/manager.module)"
          echo "manager.module (wrapped): $manager_size bytes"
          test "$manager_size" -le 262144

          # Select the M2 root from the same signed index. This exercises the
          # exact dependency graph and checks it fits arena regions 2 and 3.
          cargo run --quiet --manifest-path tools/module-release/Cargo.toml -- \
            build --spec packages/runtime-modules.toml --out target/modules/m2-release \
              --raw-base https://example.invalid --release ci --key "$seed" --epoch 1 \
              --root m2-root@1.0.0
          test -s target/modules/m2-release/package-index.conf.sig
          grep -q "depends=m2-mesh@1.0.0:" target/modules/m2-release/package-index.conf

  docs:
