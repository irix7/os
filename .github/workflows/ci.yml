  lint:
    name: Markdown and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#book" "#docs/research/**"
      - name: typos
        uses: crate-ci/typos@master
