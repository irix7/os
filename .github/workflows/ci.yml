          iris-ci --socket "$socket" serial-wait 'hello from std' --timeout 120
          iris-ci --socket "$socket" serial-wait 'file=hello from the IRIX 7 ramfs' --timeout 30
          iris-ci --socket "$socket" serial-wait 'write=ok' --timeout 30
          iris-ci --socket "$socket" serial-wait 'chdir=ok' --timeout 30
          iris-ci --socket "$socket" serial-wait 'cwd=/etc' --timeout 30
          iris-ci --socket "$socket" serial-wait 'relative=Welcome to IRIX 7 (Wasm).' --timeout 30
          iris-ci --socket "$socket" serial-wait 'stat_size=17' --timeout 30
          iris-ci --socket "$socket" serial-wait 'dev_null=ok' --timeout 30
          iris-ci --socket "$socket" serial-wait 'entry=hello.txt' --timeout 30
          iris-ci --socket "$socket" serial-wait 'user: exit syscall code=0x00000000' --timeout 30
          iris-ci --socket "$socket" serial-wait 'm1-post: mesh=0/0/0' --timeout 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'BOOT-READY .*network=off mcp=disabled' 30
