  mesh-real:
    name: Mesh two-kernel (M2 gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src + llvm-tools
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "mesh-real"
      - name: Setup IRIS
        id: iris
        uses: irix7/iris/.github/actions/setup-iris@8da7ae21e558f4d5d075e5f50720fabba0a728e6
        with:
          version: v0.1.13+irix7
      - name: Build the two-node artefacts
        env:
          M2_KERNEL_PORT: "18200"
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          work="$RUNNER_TEMP/m2-build"
          tools/m2-rig/build.sh "$work"
          sha256sum "$work/irix7-rom.bin" | tee "$work/SHA256SUMS"
          test "$(stat -c%s "$work/irix7-rom.bin")" -le 524288
          # Each node's PROM fetches this build's kernel through its gateway, so
          # the gate runs the kernel this PR compiled, not releases/latest.
          (cd "$work" && nohup python3 -m http.server 18200 --bind 0.0.0.0 \
            > "$RUNNER_TEMP/m2-kernel-fixture.log" 2>&1 &)
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:18200/kernel-indy-latest.bin
      - name: Host harness tests
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/m2-rig/Cargo.toml
      - name: Run two real kernels
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          iris_bin="$(command -v iris)"
          iris_ci="$(command -v iris-ci)"
          build="$RUNNER_TEMP/m2-build"
          harness="$RUNNER_TEMP/m2-rig-harness"
          cargo build --release --manifest-path tools/m2-rig/Cargo.toml \
            --target-dir "$harness"
          bin="$harness/release/m2-rig"

          # Every mode gets its own work directory and port block.  The rig
          # stops both guests itself; cleanup only runs `down` on a failed
          # scenario and never masks the run's exit status.
          run_mode() {
            mode="$1"
            base="$2"
            transport="${3:-relay}"
            fault="${4:-$mode}"
            work="$RUNNER_TEMP/m2-run-$mode"
            echo "::group::m2-rig $mode (base port $base, transport $transport, fault $fault)"
            "$bin" run \
              --work "$work" \
              --rom "$build/irix7-rom.bin" \
              --iris "$iris_bin" --iris-ci "$iris_ci" \
              --base-port "$base" --timeout 240 \
              --transport "$transport" --fault "$fault"
            echo "::endgroup::"
          }
          cleanup() {
            status=$?
            trap - EXIT
            for mode in none no-peer kill-peer partition udp direct demo; do
              work="$RUNNER_TEMP/m2-run-$mode"
              if [ -d "$work" ]; then
                "$bin" down --work "$work" \
                  --rom "$build/irix7-rom.bin" \
                  --iris "$iris_bin" --iris-ci "$iris_ci" >/dev/null 2>&1 || true
              fi
            done
            exit "$status"
          }
          trap cleanup EXIT

          # The default mode proves join, homes, route/MOVED, L0 migration,
          # the member restart, the signed epoch restore and the root restart.
          run_mode none 9700
          # The no-peer mode preserves the M1 `mesh=single`/`mesh=0/0/0` path.
          run_mode no-peer 9800
          # The two failure modes prove removal/fencing and the partition rule.
          run_mode kill-peer 9900
          run_mode partition 10000
          # The datagram gate proves the ABI 16 UDP service and the
          # non-blocking Seeq transmit path across two real kernels
          # (M3-ADR-0006).  It runs no join.
          run_mode udp 10100
          # The direct gate removes the host relay from the mesh path: the
          # lower NodeId calls tcp_connect through its own NAT peer forward
          # and the higher NodeId listens.  Join, homes, route, migration and
          # both restarts run on that link (#245).
          run_mode direct 10200 direct none
      - name: One-computer M2 transcript
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          iris_bin="$(command -v iris)"
          iris_ci="$(command -v iris-ci)"
          build="$RUNNER_TEMP/m2-build"
          harness="$RUNNER_TEMP/m2-rig-harness"
          bin="$harness/release/m2-rig"
          "$bin" demo \
            --work "$RUNNER_TEMP/m2-run-demo" \
            --rom "$build/irix7-rom.bin" \
            --iris "$iris_bin" --iris-ci "$iris_ci" \
            --base-port 10400 --timeout 240
      - name: Collect evidence
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m2-evidence"
          mkdir -p "$out"
          for mode in none no-peer kill-peer partition udp direct demo; do
            work="$RUNNER_TEMP/m2-run-$mode"
            if [ -d "$work/evidence" ]; then
              cp -a "$work/evidence" "$out/$mode"
            fi
            if [ -d "$work/demo" ]; then
              mkdir -p "$out/$mode"
              cp -a "$work/demo" "$out/$mode/demo"
            fi
            if [ -d "$work" ]; then
              for node in n0 n1; do
                mkdir -p "$out/$mode/$node"
                for file in iris-serial.log stdout stderr; do
                  if [ -f "$work/$node/$file" ]; then
                    cp "$work/$node/$file" "$out/$mode/$node/$file"
                  fi
                done
              done
            fi
          done
          cp "$RUNNER_TEMP/m2-build/SHA256SUMS" "$out/"
          find "$out" -type f | sort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-real-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/m2-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-real-artifacts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/m2-build/SHA256SUMS
            ${{ runner.temp }}/m2-build/irix7-rom.bin
            ${{ runner.temp }}/m2-build/irix7-rom-n0.bin
            ${{ runner.temp }}/m2-build/irix7-rom-n1.bin

  socket-slots:
    name: Socket slots (8 TCP slots)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src + llvm-tools
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "socket-slots"
      - name: Setup IRIS
        id: iris
        uses: irix7/iris/.github/actions/setup-iris@8da7ae21e558f4d5d075e5f50720fabba0a728e6
        with:
          version: v0.1.13+irix7
      - name: Build the kernel and a ROM that fetches it
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          work="$RUNNER_TEMP/socket-slots"
          mkdir -p "$work/fixture"
          CARGO_PROFILE_RELEASE_OPT_LEVEL=z \
            CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Tkernel/linker.ld" \
            cargo build --release -Z build-std=core,alloc -Zjson-target-spec \
              --features cross --target targets/mips3-sgi-irix7-n32.json -p kernel
          OBJCOPY="$(find "$(rustc --print sysroot)" -name llvm-objcopy | head -1)"
          "$OBJCOPY" -O binary target/mips3-sgi-irix7-n32/release/kernel \
            "$work/fixture/kernel-indy-latest.bin"
          IRIX7_KERNEL_URL=http://192.168.0.1:18300/kernel-indy-latest.bin \
          CARGO_PROFILE_RELEASE_OPT_LEVEL=z CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 \
          CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Trom/linker.ld" \
            cargo build --release -Z build-std=core,alloc -Zjson-target-spec \
              --features cross --target targets/mips3-sgi-irix7-n32.json -p rom
          python3 rom/tools/make_prom.py \
            target/mips3-sgi-irix7-n32/release/rom "$work/irix7-rom.bin"
          test "$(stat -c%s "$work/irix7-rom.bin")" -le 524288
      - name: Open eight sockets at once
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/socket-slots"
          run="$RUNNER_TEMP/socket-slots-run"
          rm -rf "$run" && mkdir -p "$run"
          cd "$run"
          # Eight echo listeners on the runner; the kernel connects to 192.168.0.1.
          python3 - <<'PY' > echo.log 2>&1 &
          import socket
          import threading

          def serve(port):
              s = socket.socket()
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(("0.0.0.0", port))
              s.listen(4)
              while True:
                  c, _ = s.accept()
                  def handle(c=c):
                      try:
                          while True:
                              d = c.recv(512)
                              if not d:
                                  break
                              c.sendall(d)
                      finally:
                          c.close()
                  threading.Thread(target=handle, daemon=True).start()

          for p in range(10600, 10608):
              threading.Thread(target=serve, args=(p,), daemon=True).start()
          threading.Event().wait()
          PY
          echo_pid=$!
          (cd "$work/fixture" && python3 -m http.server 18300 --bind 0.0.0.0 > "$run/fixture.log" 2>&1 &)
          printf 'banks = [32, 0, 0, 0]\nno_audio = true\n\n[machine]\nprofile = "indy_ip24"\n\n[scsi]\n' > machine.toml
          python3 - "$run/nvram.bin" <<'PY'
          import sys
          env = b"ports.base=10600\0ports.count=8\0\0"
          image = bytearray(8192)
          image[0x10:0x10 + len(env)] = env
          image[314:320] = bytes([0x02, 0x11, 0x22, 0x33, 0x44, 0x55])
          open(sys.argv[1], "wb").write(image)
          PY
          socket="$run/iris.sock"
          IRIS_NO_IDLE=1 iris --config "$run/machine.toml" --ci --prom "$work/irix7-rom.bin" \
            --nvram "$run/nvram.bin" --ci-socket "$socket" --monitor-port 18885 \
            --serial-log "$run/serial.log" >"$run/iris.out" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" "$echo_pid" 2>/dev/null || true
            pkill -f "http.server 18300" 2>/dev/null || true
          }
          trap cleanup EXIT
          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          iris-ci --socket "$socket" serial-wait 'BOOT-READY' --timeout 300
          # The self-test prints before BOOT-READY, so check the log file, not the stream.
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$run/serial.log" 'ports: pass sockets=8' 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socket-slots-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/socket-slots-run/evidence

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: mdbook build
        run: mdbook build

  lint:
    name: Markdown and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#book" "#docs/research/**"
      - name: typos
        uses: crate-ci/typos@master
