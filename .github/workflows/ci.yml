name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: |
          if [ -f Cargo.toml ]; then
            cargo fmt --all -- --check
            (cd guest/wasm-policy && cargo fmt -- --check)
          else
            echo "No Rust workspace yet; skipping."
          fi

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit sign-offs
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while IFS= read -r commit; do
            author="$(git show -s --format='%an <%ae>' "$commit")"
            if ! git show -s --format=%B "$commit" | grep -Fqi "Signed-off-by: ${author}"; then
              echo "::error::commit ${commit} is not signed off by ${author}"
              missing=1
            fi
          done < <(git rev-list --no-merges "${base}..${head}")
          exit "$missing"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: |
          if [ -f Cargo.toml ]; then
            cargo clippy --workspace --all-targets -- -D warnings
            cargo clippy --manifest-path tools/m2-rig/Cargo.toml \
              --all-targets -- -D warnings
          else
            echo "No Rust workspace yet; skipping."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          if [ -f Cargo.toml ]; then
            cargo test -p kernel -p kernel-core -p kernel-test -p boot-protocol-tests \
              -p erofs -p block-cache -p overlay -p hpc3 -p irix-elf -p native-abi \
              -p sys-primitives -p platform-api -p mesh-core -p mesh-join \
              -p mesh-route -p mesh-service -p mesh-sim -p mesh-transport \
              -p mesh-stream -p mesh-migrate -p fabric -p guest-abi -p cas-core \
              -p cas-store \
              -p cap-engine -p agnostic-core -p wasm-host \
              -p wasm-policy-host -p mcp
            cargo test --manifest-path tools/m2-rig/Cargo.toml
          else
            echo "No Rust workspace yet; skipping."
          fi

  tools:
    name: MCP smoke tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python tests
        run: python3 -m unittest discover -s rom/tools -p 'test_*.py'

  std-surface:
    name: Std ABI surface audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned nightly + rust-src
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          rustup toolchain install nightly-2026-10-03 --component rust-src
          rustup default nightly-2026-10-03
      - name: Python tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Audit the std ABI surface (warning mode)
        run: python3 tools/std-abi-surface.py
      - name: Build native std rlib (spike)
        timeout-minutes: 15
        env:
          STD_SPIKE_WORK: ${{ runner.temp }}/std-spike
        run: tools/std-spike/build-std.sh

  relibc:
    name: relibc (n32 PAL probes)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install the repository and relibc toolchains
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install nightly-2026-10-03 \
            --component rust-src --component llvm-tools-preview
          # relibc's rust-toolchain.toml selects this nightly for the PAL.
          rustup toolchain install nightly-2026-05-24 --component rust-src
          rustup default nightly-2026-10-03
      - name: Restore the pinned relibc build
        id: relibc-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/relibc-pal/out
          # The key covers the pinned relibc commit (build.sh), the target
          # spec and every probe source.  A cache hit skips the clone, the
          # Bootlin download and the relibc build; a source change rebuilds.
          key: relibc-pal-${{ runner.os }}-2026.08-1-${{ hashFiles('tools/relibc-pal/build.sh', 'targets/mips3-sgi-irix7-native-n32.json', 'user/relibc-*/**') }}
      - name: Build the pinned relibc probes
        env:
          RELIBC_COMMIT: a9b3adc45901270d2ba267ac146abee187b65ec9
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          work="$RUNNER_TEMP/relibc-pal"
          out="$work/out"
          src="$work/src"
          if [ -s "$out/BUILD-PROVENANCE.txt" ]; then
            echo "restored the cached relibc probe build"
            cat "$out/BUILD-PROVENANCE.txt"
          else
            toolchain="$work/toolchain"
            if [ ! -x "$toolchain/bin/mips64-buildroot-linux-uclibc-gcc" ]; then
              rm -rf "$toolchain"
              mkdir -p "$toolchain"
              curl -fsSL \
                https://toolchains.bootlin.com/downloads/releases/toolchains/mips64-n32/tarballs/mips64-n32--uclibc--stable-2026.08-1.tar.xz \
                | tar -xJ -C "$toolchain" --strip-components=1
            fi
            if [ ! -d "$src/.git" ]; then
              git clone --recurse-submodules --branch irix7-pal \
                https://github.com/irix7/relibc "$src"
            fi
            # A fresh clone lands on the branch head; the build script only
            # accepts the pinned commit, so check it out explicitly.
            git -C "$src" fetch --quiet origin "$RELIBC_COMMIT" || true
            git -C "$src" checkout --detach "$RELIBC_COMMIT"
            git -C "$src" submodule update --init --recursive
            CARGO_TARGET_DIR="$work/target" \
            RELIBC_SRC="$src" \
            MIPS_CC="$toolchain/bin/mips64-buildroot-linux-uclibc-gcc" \
            MIPS_AR="$toolchain/bin/mips64-buildroot-linux-uclibc-ar" \
            CARGO=cargo \
              tools/relibc-pal/build.sh "$out"
          fi
          grep -q '^relibc=a9b3adc45901270d2ba267ac146abee187b65ec9$' \
            "$out/BUILD-PROVENANCE.txt"
          for probe in probe thread-probe futex-probe pthread-probe sleep-probe \
            forkexec-probe forkexec-child; do
            test -s "$out/$probe.raw"
          done
      - name: Build the kernel and PROM
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/m2-rig/build.sh "$RUNNER_TEMP/relibc-rig"
      - name: Setup IRIS
        id: iris
        uses: irix7/iris/.github/actions/setup-iris@8da7ae21e558f4d5d075e5f50720fabba0a728e6
        with:
          version: v0.1.13+irix7
      - name: Boot every probe
        run: |
          set -euo pipefail
          tools/relibc-pal/boot-probes.sh \
            "$RUNNER_TEMP/relibc-pal/out" \
            "$RUNNER_TEMP/relibc-rig/irix7-rom.bin" \
            "$RUNNER_TEMP/relibc-boot"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relibc-probes
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/relibc-pal/out/BUILD-PROVENANCE.txt
            ${{ runner.temp }}/relibc-pal/out/SHA256SUMS
            ${{ runner.temp }}/relibc-boot/*/serial.log
            ${{ runner.temp }}/relibc-boot/*/iris.out

  cross:
    name: Cross-build (M0 gate)
    runs-on: ubuntu-latest
    # M0 gate: build-std must compile core/alloc for both custom targets.
    # Green (not continue-on-error) once the toolchain glue is resolved.
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - name: Ensure host C compiler (cc)
        run: |
          command -v cc >/dev/null 2>&1 || sudo apt-get install -y gcc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "m0-cross"
      - name: Build n32 kernel (build-std)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          RUST_LLD_DIR="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          export RUST_LLD_DIR
          export PATH="$RUST_LLD_DIR:$PATH"
          cargo build -Z build-std=core,alloc -Zjson-target-spec \
            --target targets/mips3-sgi-irix7-n32.json -p kernel
      - name: Build ROM (build-std, M1)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          RUST_LLD_DIR="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          export RUST_LLD_DIR
          export PATH="$RUST_LLD_DIR:$PATH"
          # The ROM links text at the PROM reset window and data in DRAM.
          CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Trom/linker.ld" \
            cargo build -Z build-std=core,alloc -Zjson-target-spec --features cross \
            --target targets/mips3-sgi-irix7-n32.json -p rom
      - name: Build native user hello ELF
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/user-hello-target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          RUST_LLD_DIR="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          export RUST_LLD_DIR
          export PATH="$RUST_LLD_DIR:$PATH"
          tools/build-user-hello.sh ${{ runner.temp }}/user-hello

      - name: Build native target probe (build-std)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          RUST_LLD_DIR="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          export RUST_LLD_DIR
          export PATH="$RUST_LLD_DIR:$PATH"
          # This is the hosted native target, not the kernel target: it must expose
          # target_os=irix7 and the unix family for the POSIX libc/std work.
          cargo build -Z build-std=core -Zjson-target-spec \
            --target targets/mips3-sgi-irix7-native-n32.json -p irix-elf -p native-abi
  boot:
    name: Boot (iris)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src + llvm-tools
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "iris-boot"
      - name: Build release kernel
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          CARGO_PROFILE_RELEASE_OPT_LEVEL=z \
            CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Tkernel/linker.ld" \
            cargo build --release -Z build-std=core,alloc -Zjson-target-spec \
              --features cross --target targets/mips3-sgi-irix7-n32.json -p kernel
      - name: Serve this kernel to the ROM
        # The ROM downloads the kernel over HTTP from this fixture instead of
        # releases/latest, so the gate tests the kernel built by this PR.
        run: |
          set -euo pipefail
          OBJCOPY="$(find "$(rustc --print sysroot)" -name llvm-objcopy | head -1)"
          mkdir -p "$RUNNER_TEMP/kernel-fixture"
          "$OBJCOPY" -O binary target/mips3-sgi-irix7-n32/release/kernel \
            "$RUNNER_TEMP/kernel-fixture/kernel-indy-latest.bin"
          (cd "$RUNNER_TEMP/kernel-fixture" && nohup python3 -m http.server 18200 \
            --bind 0.0.0.0 > "$RUNNER_TEMP/kernel-fixture.log" 2>&1 &)
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:18200/kernel-indy-latest.bin
      - name: Build ROM
        env:
          IRIX7_KERNEL_URL: http://192.168.0.1:18200/kernel-indy-latest.bin
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # opt-level z and one codegen unit keep the downloader inside the PROM window.
          CARGO_PROFILE_RELEASE_OPT_LEVEL=z CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 \
          CARGO_TARGET_MIPS3_SGI_IRIX7_N32_RUSTFLAGS="-Clink-arg=-Trom/linker.ld" \
            cargo build --release -Z build-std=core,alloc -Zjson-target-spec \
              --features cross --target targets/mips3-sgi-irix7-n32.json -p rom
          python3 rom/tools/make_prom.py \
            target/mips3-sgi-irix7-n32/release/rom "$RUNNER_TEMP/irix7-rom.bin"
          rom_size=$(stat -c%s "$RUNNER_TEMP/irix7-rom.bin")
          echo "PROM: $rom_size bytes"
          test "$rom_size" -le 524288
      - name: Build user hello disk image
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/user-hello-target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/build-user-hello.sh "$RUNNER_TEMP/user-hello"
      - name: Build o32 probe
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/o32-hello-target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/build-o32-hello.sh "$RUNNER_TEMP/o32-hello"
      - name: Check the Wasm policy guest
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/build-wasm-guest.sh "$RUNNER_TEMP/policy-guest.wasm"
          cmp "$RUNNER_TEMP/policy-guest.wasm" guest/wasm-policy/guest.wasm

      - name: Build static std hello
        timeout-minutes: 20
        env:
          STD_SPIKE_WORK: ${{ runner.temp }}/std-spike
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/std-spike/build-std.sh
          tools/build-std-hello.sh "$RUNNER_TEMP/std-hello"

      - name: Setup IRIS
        id: iris
        uses: irix7/iris/.github/actions/setup-iris@4b00413663a979d15b7ef8cd2208d95a030796a4
        with:
          version: v0.1.6+irix7
      - name: REX3 engine gate
        run: |
          tools/rex3-gate.py --rom "$RUNNER_TEMP/irix7-rom.bin" --work "$RUNNER_TEMP/rex3-gate"

      - name: Boot ROM diskless and discover packages
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-diskless"
          mkdir -p "$work"
          cd "$work"
          cat > "$work/machine.toml" <<'EOF'
          banks = [32, 0, 0, 0]
          no_audio = true

          [machine]
          profile = "indy_ip24"

          [scsi]

          [[port_forward]]
          proto = "tcp"
          host_port = 2324
          guest_port = 23
          bind = "localhost"
          EOF

          python3 - "$work/nvram.bin" <<'PY'
          import sys

          image = bytearray(8192)
          image[314:320] = bytes([0x02, 0x11, 0x22, 0x33, 0x44, 0x55])
          open(sys.argv[1], "wb").write(image)
          PY

          socket="$work/iris.sock"
          iris --config "$work/machine.toml" --ci \
            --prom "$RUNNER_TEMP/irix7-rom.bin" \
            --nvram "$work/nvram.bin" \
            --ci-socket "$socket" --monitor-port 18887 \
            --serial-log "$work/serial.log" >"$work/iris.out" 2>&1 &
          pid=$!
          cleanup() {
            status=$?
            kill "$pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- iris output (tail)"
              tail -50 "$work/iris.out" || true
              echo "--- serial log (tail)"
              tail -50 "$work/serial.log" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          iris-ci --socket "$socket" serial-wait 'm1: ' --timeout 30
          iris-ci --socket "$socket" serial-wait 'BOOT-READY' --timeout 300
          iris-ci --socket "$socket" serial-wait 'mesh=single' --timeout 10
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'm1: .*mesh=0/0/0' 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'BOOT-READY .*network=up mcp=listening' 30
          # No SCSI target is attached: the user loader must fail cleanly and
          # leave the network-backed sash at the console.
          iris-ci --socket "$socket" serial-wait 'userelf: read failed' --timeout 60
          iris-ci --socket "$socket" serial-wait 'sash> ' --timeout 60
          iris-ci --socket "$socket" serial-wait 'm1-post: mesh=0/0/0' --timeout 60

          python3 - <<'PY'
          import socket
          import time

          def read_until(sock, marker, timeout=30):
              sock.settimeout(timeout)
              data = b""
              while marker not in data:
                  chunk = sock.recv(8192)
                  if not chunk:
                      break
                  data += chunk
              return data

          with socket.create_connection(("127.0.0.1", 2324), timeout=10) as sock:
              read_until(sock, b"sash> ")
              sock.sendall(b"packages\r\n")
              listing = read_until(sock, b"sash> ")
              if b"userland std-hello" not in listing:
                  raise SystemExit("package index did not list std-hello: %r" % listing)
              print("diskless package index: ok")
          PY
          iris-ci --socket "$socket" quit
          wait "$pid"

      - name: Boot ROM with slot-B wasm autoload
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-wasm-autoload"
          mkdir -p "$work"
          cd "$work"
          cat > "$work/machine.toml" <<'EOF'
          banks = [32, 0, 0, 0]
          no_audio = true

          [machine]
          profile = "indy_ip24"

          [scsi]
          EOF

          python3 - "$work/nvram.bin" <<'PY'
          import sys

          env = (b"wasm.policy=on\0"
                 b"console=serial0\0\0")
          image = bytearray(8192)
          image[0x10:0x10 + len(env)] = env
          image[314:320] = bytes([0x02, 0x11, 0x22, 0x33, 0x44, 0x55])
          open(sys.argv[1], "wb").write(image)
          PY

          socket="$work/iris.sock"
          iris --config "$work/machine.toml" --ci \
            --prom "$RUNNER_TEMP/irix7-rom.bin" \
            --nvram "$work/nvram.bin" \
            --ci-socket "$socket" --monitor-port 18885 \
            --serial-log "$work/serial.log" >"$work/iris.out" 2>&1 &
          pid=$!
          cleanup() {
            status=$?
            kill "$pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- iris output (tail)"
              tail -50 "$work/iris.out" || true
              echo "--- serial log (tail)"
              tail -50 "$work/serial.log" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          iris-ci --socket "$socket" serial-wait 'BOOT-READY' --timeout 300
          iris-ci --socket "$socket" serial-wait 'mesh=single' --timeout 10
          iris-ci --socket "$socket" serial-wait 'wasm: host=1' --timeout 120
          iris-ci --socket "$socket" serial-wait 'wasm: run=42' --timeout 120
          # `serial-wait` matches the socket stream as soon as the prefix
          # arrives, which can be mid-line; the `--serial-log` mirror is a
          # separate writer and can still be a few bytes behind.  Wait for the
          # complete line (the actor follows the marker) and poll the file
          # instead of asserting on it in the same instant.
          iris-ci --socket "$socket" serial-wait 'm1-post: mesh=0/0/0 actor=' --timeout 120
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'm1: .*mesh=0/0/0' 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'm1-post: mesh=0/0/0 actor=' 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'BOOT-READY .*network=up mcp=listening' 30
          python3 - "$work/serial.log" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = text.replace(chr(13), "")
          native = re.search(
              r"^m1: root=([0-9a-f]{64}) .*? actor=([0-9a-f]{32}) "
              r".*? cap=ok rights=([0-9]+) .*? home=([0-9a-f]{32})",
              text,
              re.MULTILINE,
          )
          wasm = re.search(
              r"^m1-wasm: root=([0-9a-f]{64}) actor=([0-9a-f]{32}) "
              r"cap=ok rights=([0-9]+) home=([0-9a-f]{32}) "
              r"objects=9 actors=1 queued=1 caps=1$",
              text,
              re.MULTILINE,
          )
          assert native, "missing native m1 policy line"
          assert wasm, "missing Wasm policy evidence"
          # The guest deliberately chooses a different motd, so its root OID
          # must differ. Actor identity, rights and home are the policy values
          # that must agree; the live bridge is proved by the distinct motd.
          assert native.group(1) != wasm.group(1), (
              "guest root is not distinct from native root: "
              f"{native.group(1)}"
          )
          assert native.group(2) != wasm.group(2), (
              "guest actor is not distinct from native actor: "
              f"{native.group(2)}"
          )
          assert native.group(3) == wasm.group(3), "rights differ"
          assert native.group(4) == wasm.group(4), "home differs"
          assert native.group(3) == "35", "unexpected M1 rights"
          print(
              "wasm policy has distinct root and matches actor/rights/home:",
              wasm.group(1),
          )
          PY
          # The Wasm boot has completed and all policy assertions have passed;
          # iris may already be tearing down, so make the quit/wait best-effort.
          iris-ci --socket "$socket" quit || true
          wait "$pid" || true

      - name: Boot local slot-B Wasm with net=off
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-wasm-local"
          mkdir -p "$work"
          cd "$work"
          cat > "$work/machine.toml" <<'EOF'
          banks = [32, 0, 0, 0]
          no_audio = true

          [machine]
          profile = "indy_ip24"

          [scsi]
          EOF

          python3 - "$work/nvram.bin" <<'PY'
          import sys

          env = (b"wasm.policy=on\0"
                 b"net=off\0console=serial0\0\0")
          image = bytearray(8192)
          image[0x10:0x10 + len(env)] = env
          image[314:320] = bytes([0x02, 0x11, 0x22, 0x33, 0x44, 0x55])
          open(sys.argv[1], "wb").write(image)
          PY

          socket="$work/iris.sock"
          iris --config "$work/machine.toml" --ci \
            --prom "$RUNNER_TEMP/irix7-rom.bin" \
            --nvram "$work/nvram.bin" \
            --ci-socket "$socket" --monitor-port 18891 \
            --serial-log "$work/serial.log" >"$work/iris.out" 2>&1 &
          pid=$!
          cleanup() {
            status=$?
            kill "$pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- iris output (tail)"
              tail -50 "$work/iris.out" || true
              echo "--- serial log (tail)"
              tail -80 "$work/serial.log" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          iris-ci --socket "$socket" status --wait-ready 30
          iris-ci --socket "$socket" start
          iris-ci --socket "$socket" serial-wait 'BOOT-READY' --timeout 300
          iris-ci --socket "$socket" serial-wait 'mesh=single' --timeout 10
          iris-ci --socket "$socket" serial-wait 'm1-wasm: ' --timeout 180
          iris-ci --socket "$socket" serial-wait 'wasm: runtime=' --timeout 30
          iris-ci --socket "$socket" serial-wait 'm1-post: mesh=0/0/0' --timeout 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'BOOT-READY .*network=off mcp=disabled' 30
          "$GITHUB_WORKSPACE/tools/wait-serial-log.sh" "$work/serial.log" 'm1: .*mesh=0/0/0' 30
          iris-ci --socket "$socket" quit
          wait "$pid"

      - name: Boot static std image
        env:
          IRIS_NO_IDLE: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/iris-std"
          mkdir -p "$work"
          cd "$work"
          cat > "$work/machine.toml" <<'EOF'
          banks = [32, 0, 0, 0]
