  powerpc:
    name: Boot (PowerPC G3 QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
      - name: Install pinned nightly + rust-src + llvm-tools
        run: |
          rustup toolchain install nightly-2026-10-03 --component rust-src --component llvm-tools-preview
          rustup default nightly-2026-10-03
      - name: Ensure host C compiler (cc)
        run: |
          command -v cc >/dev/null 2>&1 || sudo apt-get install -y gcc
      - name: Ensure QEMU PowerPC and hfsutils
        run: |
          if ! command -v qemu-system-ppc >/dev/null 2>&1 \
            || ! command -v hformat >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y qemu-system-ppc hfsutils
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "powerpc-boot"
      - name: Build and boot the G3 Beige machine
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/powerpc-qemu.sh "$RUNNER_TEMP/powerpc-qemu"
      - name: Build the PowerPC floppy image
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/powerpc-floppy.sh "$RUNNER_TEMP/irix7-powerpc-floppy.img"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerpc-qemu
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/powerpc-qemu/serial.log
            ${{ runner.temp }}/powerpc-qemu/serial-b.log
            ${{ runner.temp }}/irix7-powerpc-floppy.img

